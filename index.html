<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><title>FINTRACK</title>
<style>
:root{--bg:#fff;--card:#fff;--tx:#141416;--mu:#80808a;--ln:#dcdce0;--ink:#141416;--on:#fff;--g:#1f8a4c;--r:#c8372d}
[data-t=dark]{--bg:#0c0c0d;--card:#171719;--tx:#f1f1f3;--mu:#92929c;--ln:#2b2b30;--ink:#f1f1f3;--on:#111;--g:#4cc27f;--r:#ff6b60}
*{box-sizing:border-box;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:var(--bg);color:var(--tx);font-size:15px;padding:env(safe-area-inset-top) 0 96px}
main{max-width:640px;margin:auto;padding:18px 16px}
h1{font-size:28px;font-weight:700;letter-spacing:-.5px}h2{font-size:12px;color:var(--mu);font-weight:500;margin:22px 0 10px;text-transform:uppercase;letter-spacing:.7px}h3{margin-bottom:12px}
small,.mu{color:var(--mu);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:16px;margin-bottom:12px}
.hero{background:var(--ink);color:var(--on);border-radius:10px;padding:20px;margin-bottom:12px}
.hero small{color:inherit;opacity:.6}.big{font-size:32px;font-weight:600;letter-spacing:-1px;margin:4px 0 14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2 .card{margin:0;padding:14px}.g2 b{display:block;font-size:17px;margin-top:3px}
.dash{border:1.5px dashed var(--mu);background:transparent}
.row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.row>div:first-child{min-width:0}.row small{display:block;margin-top:2px;overflow-wrap:anywhere}.r{text-align:right;flex:none}
.in{color:var(--g)}.out{color:var(--r)}
button,select,input,textarea{font-size:15px;color:var(--tx)}
button{background:none;border:1px solid var(--ln);border-radius:6px;padding:7px 11px;cursor:pointer}
button.pri,.pill button.on{background:var(--ink);color:var(--on);border-color:var(--ink)}
.sm button{padding:3px 8px;margin:4px 0 0 4px;font-size:13px;color:var(--mu)}
.pill{display:flex;border:1.5px solid var(--ink);border-radius:30px;padding:3px;margin:14px 0 14px;overflow:auto}
.pill button{flex:1;border:0;border-radius:30px;white-space:nowrap;font-size:13px;padding:8px 10px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:10px;margin-top:5px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:11px}
.ib{border-radius:50%;width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center}.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.wal{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.wc{flex:none;min-width:128px;background:var(--ink);color:var(--on);border-radius:10px;padding:10px 12px}.wc small{color:inherit;opacity:.65;display:block}.wc b{font-size:15px}.wc.dash{background:none;color:var(--tx);border:1.5px dashed var(--mu);cursor:pointer}
.ctr{text-align:center;margin:6px 0 0}.amt{font-size:38px;font-weight:300;letter-spacing:-1.5px}
.ring{display:block;margin:10px auto 16px;width:230px;max-width:72%;color:var(--ink)}
.dk{background:var(--ink);color:var(--on)}.dk small{color:inherit;opacity:.65}
.hatch{border:1.5px solid var(--ink);background:repeating-linear-gradient(135deg,transparent 0 5px,var(--ink) 5px 6px) right bottom/44px 44px no-repeat}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;text-align:center}.cg i{display:flex;width:52px;height:52px;margin:0 auto 5px;border:1.5px solid var(--ink);border-radius:50%;align-items:center;justify-content:center;font-style:normal;font-weight:600}.cg small{display:block;font-size:10.5px;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cg b{font-size:12px}
.bar{height:8px;border-radius:3px;background:var(--ln);overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--ink)}.bar.w i{background:#d98a00}.bar.o i{background:var(--r)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--ln);display:flex;justify-content:space-around;align-items:center;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{border:0;color:var(--mu);padding:9px;border-radius:10px;display:flex}nav button.on{background:var(--ink);color:var(--on)}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .fab{background:var(--ink);color:var(--on);width:56px;height:56px;border-radius:50%;margin-top:-30px;border:5px solid var(--bg);justify-content:center;align-items:center}
#m{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:9}#m.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:12px 12px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.btns{display:flex;gap:10px}.btns button{flex:1;padding:12px}
#t{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--on);padding:10px 16px;border-radius:8px;z-index:20;display:none;max-width:90%;font-size:14px}
#lock{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}#lock input{width:180px;text-align:center;font-size:24px;letter-spacing:8px}
.bars{display:flex;gap:8px;align-items:flex-end;height:110px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.bars span{display:flex;gap:3px;align-items:flex-end;height:90px;justify-content:center}.bars i{width:12px;border-radius:2px 2px 0 0;background:var(--ink);min-height:2px}.bars i+i{background:none;border:1.5px solid var(--ink)}
.top{display:flex;justify-content:space-between;align-items:center}.warn{background:var(--ink);color:var(--on);border-radius:8px;padding:11px 14px;margin-bottom:12px;font-size:13.5px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}.menu button{padding:18px 12px;text-align:left;border-radius:8px;background:var(--card)}
.dl{display:flex;gap:8px;flex-wrap:wrap}.dl button{flex:1 1 40%}
svg.s{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1{font-size:26px}.top{margin-bottom:4px}.bk{border:0;margin:0 0 6px -8px}
.wc{min-width:136px;padding:12px}.wt{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.wt .lg{display:flex;width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;align-items:center;justify-content:center}.wt svg.s{width:14px;height:14px}.wc.dash .wt{margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px dashed var(--mu);border-radius:8px;padding:9px 12px;margin:0 8px 8px 0;font-size:13px;cursor:pointer}
.pill.t button{font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.cg{gap:18px 6px;margin-top:8px}.cg>div{cursor:pointer}.cg i{width:58px;height:58px;border-width:1.3px}.cg i svg.s{width:24px;height:24px}.cg small{font-size:9.5px;letter-spacing:.3px}.cg b{font-size:12px;font-weight:500}
.hatch{background:none;position:relative;overflow:hidden}.hatch::after{content:"";position:absolute;right:0;bottom:0;width:52px;height:52px;background:repeating-linear-gradient(45deg,transparent 0 4px,var(--ink) 4px 5px);clip-path:polygon(100% 0,100% 100%,0 100%)}
.sc{padding:14px;min-height:118px}.sc svg.s{margin-bottom:10px}.sc>b:first-of-type{font-size:14px;margin:0}.sc small{display:block}.sc .v{margin-top:14px;font-size:17px;font-weight:600}
.ttl{border:0;background:none;font-size:18px;font-weight:700;width:auto;margin:0;padding:6px;appearance:none;text-align:center}
.amt{font-size:42px}.g2 .sc b.v{font-size:17px}
.day summary{display:flex;justify-content:space-between;gap:10px;cursor:pointer;list-style:none}.day summary::-webkit-details-marker{display:none}.day summary small{display:block;margin-top:2px}.day[open] summary{border-bottom:1px solid var(--ln);padding-bottom:8px;margin-bottom:2px}.day{padding:14px 16px}
</style></head><body>
<main id="main"></main><div id="m"></div><div id="t"></div>
<div id="lock"><h1>FINTRACK</h1><small>Masukkan PIN</small><input id="pin" type="password" inputmode="numeric" maxlength="8"><button class="pri" onclick="A.unlock()">Buka</button></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>(n<0?'-':'')+'Rp'+Math.abs(Math.round(n)).toLocaleString('id-ID'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const p2=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),fd=s=>s?s.split('-').reverse().join('/'):'';
const T={income:'Pemasukan',expense:'Pengeluaran',transfer:'Transfer',debt_pay:'Bayar utang',loan_in:'Pinjaman masuk',invest:'Investasi',divest:'Tarik investasi',adjust:'Penyesuaian saldo'};
const blank=()=>({v:1,user:'',theme:'light',pin:'',last:'',accounts:[],tx:[],budgets:[],debts:[],goals:[],invest:[],cats:['Makan','Transportasi','Kebutuhan pribadi','Hiburan','Tagihan','Cicilan','Keluarga','Tabungan','Investasi','Gaji','Bonus','Usaha','Lainnya']});
let S=blank(),page='home',P={k:'day',a:'',b:''},Q={q:'',type:'',acc:'',cat:'',sort:'new'};
let HT='exp',ST='all';const INC=['Gaji','Bonus','Usaha'],IVC=['Saham','ETF','Bitcoin','Kripto lainnya','Deposito','Reksa dana','Emas','Aset lainnya'];
const CI={Makan:'food',Transportasi:'car','Kebutuhan pribadi':'user',Hiburan:'music',Tagihan:'receipt',Cicilan:'card',Keluarga:'home',Tabungan:'wallet',Investasi:'trend',Gaji:'cash',Bonus:'gift',Usaha:'brief'};
/* ===== Penyimpanan: IndexedDB (cadangan localStorage) ===== */
const DB={o(){return new Promise(r=>{try{const q=indexedDB.open('fintrack',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}})},
async get(){const d=await this.o();if(!d)return JSON.parse(localStorage.ft||'null');return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get('s');q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})},
async set(s){const d=await this.o();if(!d){localStorage.ft=JSON.stringify(s);return}return new Promise((r,j)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(s,'s');t.oncomplete=r;t.onerror=()=>j(t.error)})}};
async function save(){try{await DB.set(JSON.parse(JSON.stringify(S)));try{localStorage.ftb=JSON.stringify(S)}catch(e){}if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();if(e.quota&&e.usage/e.quota>.8)toast('Penyimpanan hampir penuh. Lakukan backup dan hapus data lama.')}}catch(e){toast('Gagal menyimpan data! Lakukan backup segera.')}}
function toast(s){const t=$('#t');t.textContent=s;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',3200)}
/* ===== Perhitungan ===== */
const eff=(t,id)=>{const a=+t.amount;let r=0;if(t.acc==id)r+=['expense','debt_pay','invest','transfer'].includes(t.type)?-a:a;if(t.type=='transfer'&&t.acc2==id)r+=a;return r};
const acc=id=>S.accounts.find(a=>a.id==id),an=id=>acc(id)?acc(id).name:'(dihapus)';
const bal=id=>(+acc(id).opening||0)+S.tx.reduce((s,t)=>s+eff(t,id),0);
const sum=(L,ty,f)=>L.filter(t=>t.type==ty&&(!f||f(t))).reduce((s,t)=>s+ +t.amount,0);
const paid=d=>S.tx.filter(t=>t.type=='debt_pay'&&t.debt==d.id).reduce((s,t)=>s+ +t.amount,0),rem=d=>Math.max(0,+d.total-paid(d));
const saved=g=>(g.hist||[]).reduce((s,h)=>s+h.amt,0),val=i=>i.units*i.price;
function rng(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),k=P.k;if(k=='day')return[ymd(n),ymd(n)];if(k=='week'){const d=(n.getDay()+6)%7;return[ymd(new Date(y,m,n.getDate()-d)),ymd(new Date(y,m,n.getDate()-d+6))]}if(k=='month')return[ymd(new Date(y,m,1)),ymd(new Date(y,m+1,0))];if(k=='year')return[y+'-01-01',y+'-12-31'];return[P.a||'0000',P.b||'9999']}
const inP=t=>{const[a,b]=rng();return t.date>=a&&t.date<=b};
const curM=()=>{const n=new Date();return[ymd(new Date(n.getFullYear(),n.getMonth(),1)),ymd(new Date(n.getFullYear(),n.getMonth()+1,0))]};
const used=b=>{const[a,z]=curM();return S.tx.filter(t=>t.type=='expense'&&t.cat==b.cat&&t.date>=a&&t.date<=z).reduce((s,t)=>s+ +t.amount,0)};
function months(n){const o=[],d=new Date();for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1),k=x.getFullYear()+'-'+p2(x.getMonth()+1),L=S.tx.filter(t=>t.date.slice(0,7)==k);o.push({k,l:x.toLocaleDateString('id-ID',{month:'short'}),i:sum(L,'income'),e:sum(L,'expense')})}return o}
/* ===== Komponen tampilan ===== */
const periodBar=()=>`<div class="pill">${[['day','Hari ini'],['week','Minggu ini'],['month','Bulan ini'],['year','Tahun ini'],['custom','Pilih tanggal']].map(p=>`<button class="${P.k==p[0]?'on':''}" onclick="A.per('${p[0]}')">${p[1]}</button>`).join('')}</div>${P.k=='custom'?`<div class="g2" style="margin-bottom:12px"><input type="date" value="${P.a}" onchange="P.a=this.value;render()"><input type="date" value="${P.b}" onchange="P.b=this.value;render()"></div>`:''}`;
function donut(d){const tot=d.reduce((s,x)=>s+x.v,0);if(!tot)return'<p class="mu">Belum ada data pengeluaran pada periode ini.</p>';let off=0;const C=2*Math.PI*38;return`<div style="display:flex;gap:16px;align-items:center"><svg viewBox="0 0 100 100" width="132" height="132" style="transform:rotate(-90deg);flex:none;color:var(--ink)">${d.map((x,i)=>{const l=x.v/tot*C,s=`<circle cx="50" cy="50" r="${38-(i%3)*0}" fill="none" stroke="currentColor" stroke-opacity="${Math.max(.12,1-i*.16)}" stroke-width="16" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}"/>`;off+=l;return s}).join('')}</svg><div style="flex:1">${d.map((x,i)=>`<div class="row" style="padding:5px 0;border:0"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--ink);opacity:${Math.max(.12,1-i*.16)};margin-right:7px"></i>${esc(x.l)}</span><small>${Math.round(x.v/tot*100)}%</small></div>`).join('')}</div></div>`}
const byCat=L=>{const m={};L.filter(t=>t.type=='expense').forEach(t=>m[t.cat||'Lainnya']=(m[t.cat||'Lainnya']||0)+ +t.amount);return Object.entries(m).map(([l,v])=>({l,v})).sort((a,b)=>b.v-a.v)};
const barsH=n=>{const M=months(n),mx=Math.max(1,...M.flatMap(m=>[m.i,m.e]));return`<div class="bars">${M.map(m=>`<div><span><i style="height:${m.i/mx*100}%" title="Masuk ${rp(m.i)}"></i><i style="height:${m.e/mx*100}%" title="Keluar ${rp(m.e)}"></i></span>${m.l}</div>`).join('')}</div><small>Solid: pemasukan · Garis: pengeluaran</small>`};
const progress=(v,t,w)=>{const p=t>0?v/t*100:0;return`<div class="bar ${w?(p>100?'o':p>=80?'w':''):''}"><i style="width:${Math.min(100,p)}%"></i></div>`};
const txRow=t=>{const pl=['income','loan_in','divest'].includes(t.type)||(t.type=='adjust'&&t.amount>0),ng=['expense','debt_pay','invest'].includes(t.type)||(t.type=='adjust'&&t.amount<0);return`<div class="row"><div><b>${esc(t.cat||T[t.type])}</b><small>${T[t.type]} · ${fd(t.date)} ${t.time||''}<br>${esc(an(t.acc))}${t.type=='transfer'?' → '+esc(an(t.acc2)):''}${t.method?' · '+esc(t.method):''}${t.note?'<br>'+esc(t.note):''}</small></div><div class="r"><b class="${pl?'in':ng?'out':''}">${pl?'+':ng?'-':''}${rp(Math.abs(t.amount))}</b><div class="sm"><button onclick="A.edit('tx','${t.id}')">Ubah</button><button onclick="A.dup('${t.id}')">Salin</button><button onclick="A.del('tx','${t.id}')">Hapus</button></div></div></div>`};
const acts=(k,id,x='')=>`<div class="sm">${x}<button onclick="A.edit('${k}','${id}')">Ubah</button><button onclick="A.del('${k}','${id}')">Hapus</button></div>`;
const head=(t,k,back)=>`<div class="top" style="margin-bottom:14px"><h1>${t}</h1>${k?`<button class="pri" onclick="A.edit('${k}')">+ Tambah</button>`:''}</div>`;
/* ===== Halaman ===== */
const pages={
home(){const td=ymd(new Date()),L=S.tx.filter(t=>t.date==td),old=!S.last||(Date.now()-new Date(S.last))>7*864e5,ix=S.cats.map((c,i)=>i).filter(i=>!INC.includes(S.cats[i])),ii=S.cats.map((c,i)=>i).filter(i=>INC.includes(S.cats[i]));
const tile=(oc,ic,l,v)=>`<div onclick="${oc}"><i>${I(ic)}</i><small>${esc(l)}</small><b>${v}</b></div>`;let g='';
if(HT=='exp')g=ix.slice(0,7).map(i=>tile(`A.qx(${i},'expense')`,CI[S.cats[i]],S.cats[i],rp(sum(L,'expense',t=>t.cat==S.cats[i])))).join('')+tile("A.edit('tx')",'plus','Lainnya','&nbsp;');
else if(HT=='inv')g=IVC.map(c=>tile("A.go('invest')",'trend',c,rp(S.invest.filter(i=>i.cat==c).reduce((s,i)=>s+val(i),0)))).join('')+tile("A.edit('invest')",'plus','Tambah','&nbsp;');
else g=S.goals.map(x=>tile("A.go('goals')",'wallet',x.name,rp(saved(x)))).join('')+tile("A.edit('goals')",'plus','Target baru','&nbsp;');
return`<div class="top"><h1>Beranda</h1><button class="ib" aria-label="Statistik" onclick="A.go('stats')">${I('pie')}</button></div>${old?`<div class="warn" onclick="A.go('backup')" style="cursor:pointer;margin-top:12px">Sudah lebih dari 7 hari sejak backup terakhir. Ketuk untuk backup.</div>`:''}
<h2>Rekening</h2><div class="wal">${S.accounts.map(a=>`<div class="wc"><div class="wt"><span class="lg">${I('wallet')}</span><small>${esc(a.type)}</small></div><b>${rp(bal(a.id))}</b><small style="margin-top:2px">${esc(a.name)}</small></div>`).join('')}<div class="wc dash" onclick="A.edit('accounts')"><div class="wt"><span class="lg">${I('plus')}</span></div><b>Tambah</b><small style="margin-top:2px">rekening</small></div></div>
<h2>Pemasukan</h2><div>${ii.map(i=>`<span class="chip" onclick="A.qx(${i},'income')">${I(CI[S.cats[i]])}${esc(S.cats[i])}</span>`).join('')}<span class="chip" onclick="A.edit('tx',null,{type:'income'})">${I('plus')}Lainnya</span></div>
<h2>Transaksi hari ini · ${fd(td)}</h2><div class="pill t" style="margin-top:6px">${[['exp','Pengeluaran'],['inv','Investasi'],['sav','Tabungan']].map(x=>`<button class="${HT==x[0]?'on':''}" onclick="HT='${x[0]}';render()">${x[1]}</button>`).join('')}</div><div class="cg">${g}</div>`},
stats(){const L=S.tx.filter(inP),inc=sum(L,'income'),ex=sum(L,'expense'),cash=S.accounts.reduce((s,a)=>s+bal(a.id),0),iv=S.invest.reduce((s,i)=>s+val(i),0),debt=S.debts.reduce((s,d)=>s+rem(d),0),bt=S.budgets.reduce((s,b)=>s+ +b.limit,0),bu=S.budgets.reduce((s,b)=>s+used(b),0),gt=S.goals.reduce((s,g)=>s+ +g.target,0),gs=S.goals.reduce((s,g)=>s+saved(g),0);
const tot=inc+ex,pe=tot?Math.round(ex/tot*100):0,C=2*Math.PI*62,big=ST=='inc'?inc:ST=='exp'?ex:inc-ex,n=new Date(),mn=n.toLocaleDateString('id-ID',{month:'long',year:'numeric'}),lab={day:'Hari ini',week:'Minggu ini',month:mn,year:'Tahun '+n.getFullYear(),custom:'Periode pilihan'};

${P.k=='custom'?`<div class="g2" style="margin-top:8px"><input type="date" value="${P.a}" onchange="P.a=this.value;render()"><input type="date" value="${P.b}" onchange="P.b=this.value;render()"></div>`:''}

const ld=u=>new Promise((r,j)=>{if(document.querySelector('script[src="'+u+'"]'))return r();const s=document.createElement('script');s.src=u;s.onload=r;s.onerror=j;document.head.appendChild(s)});
/* Enkripsi AES-GCM + PBKDF2 */
const b64=b=>{let s='';new Uint8Array(b).forEach(x=>s+=String.fromCharCode(x));return btoa(s)},ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function ky(p,salt){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(t,p){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),c=await crypto.subtle.encrypt({name:'AES-GCM',iv},await ky(p,salt),new TextEncoder().encode(t));return{app:'FINTRACK',version:1,enc:true,salt:b64(salt),iv:b64(iv),data:b64(c)}}
async function dec(o,p){return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.iv)},await ky(p,ub(o.salt)),ub(o.data)))}
