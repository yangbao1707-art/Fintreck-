<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MONO Finance</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{--bg:#F5F5F5;--card:#fff;--tx:#111;--t2:#777;--ln:#E5E5E5;--in:#2E9E6B;--out:#D9534F;--wa:#E8A33D;--ac:#111;--ac2:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0A0A;--card:#171717;--tx:#F2F2F2;--t2:#999;--ln:#2a2a2a;--ac:#fff;--ac2:#111;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A0A0A;--card:#171717;--tx:#F2F2F2;--t2:#999;--ln:#2a2a2a;--ac:#fff;--ac2:#111;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Outfit,Inter,system-ui,sans-serif;font-size:15px;padding-bottom:84px}
.mq{background:var(--ac);color:var(--ac2);transform:rotate(-1.5deg);margin:6px -24px 26px;padding:12px 0;overflow:hidden;white-space:nowrap;font:700 11px 'Space Mono',ui-monospace,monospace;letter-spacing:.35em;text-transform:uppercase}
.mq span{display:inline-block;padding-right:2.5em;animation:mqs 16s linear infinite}
@keyframes mqs{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.mq span{animation:none}}
.ol{color:transparent;-webkit-text-stroke:2px var(--tx)}
.mono,.s,label,h2,button,nav button{font-family:'Space Mono',ui-monospace,monospace}
main{max-width:560px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:2px;padding:16px;margin-bottom:14px}
h1{font-size:clamp(40px,13vw,60px);font-weight:800;line-height:.92;letter-spacing:-.045em;text-transform:uppercase;margin:10px 0 18px}h2{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin:0 0 12px}h3{margin:0 0 8px;text-transform:uppercase;letter-spacing:-.02em;font-size:22px;font-weight:800}
.big{font-size:clamp(24px,8vw,32px);font-weight:700;letter-spacing:-.04em;line-height:1.1;font-family:'Space Mono',ui-monospace,monospace}b{font-family:'Space Mono',ui-monospace,monospace;font-weight:700;font-size:14px;letter-spacing:-.04em}.s{color:var(--t2);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.in{color:var(--in)}.out{color:var(--out)}
button{background:var(--ac);color:var(--ac2);border:1px solid var(--ac);border-radius:0;padding:12px 14px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--ln)}button.sm{padding:6px 10px;font-size:12px}
input,select{width:100%;padding:11px;border:1px solid var(--ln);border-radius:0;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 12px}
label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--t2);display:block}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}
.item{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--ln)}.item:last-child{border:0}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--t2);border:0;border-top:3px solid transparent;font-size:10px;letter-spacing:.08em;padding:12px 2px}nav button.on{color:var(--tx);border-top-color:var(--tx)}
#fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:0;font-size:26px;padding:0}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}#sheet.on{display:flex}
.box{background:var(--card);width:100%;max-width:560px;border-radius:0;border-top:3px solid var(--tx);padding:18px;max-height:88vh;overflow:auto}
.empty{text-align:center;color:var(--t2);padding:18px}
.cols{display:flex;align-items:flex-end;gap:8px;height:110px}.cols div{flex:1;text-align:center;font-size:11px;color:var(--t2)}.cols b{display:inline-block;width:40%;background:var(--in);border-radius:4px 4px 0 0;min-height:2px}.cols b.o{background:var(--out)}
</style></head><body>
<main id="app"></main><button id="fab" aria-label="Tambah transaksi">+</button><div id="sheet"></div>
<nav id="nav"></nav>
<script>
const K='mono_finance_v1',$=s=>document.querySelector(s);
const IN=['Gaji','Upah proyek','Bonus','Bisnis','Komisi','Hasil investasi','Hadiah','Pemasukan lainnya'];
const OUT=['Makanan dan minuman','Transportasi dan bensin','Tempat tinggal','Tagihan listrik, air, internet','Belanja kebutuhan','Kesehatan','Pendidikan','Hiburan','Langganan aplikasi','Cicilan dan utang','Arisan','Keluarga','Donasi','Perawatan diri','Modal usaha','Investasi','Pengeluaran lainnya'];
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{name:'',theme:'system',accs:[{id:'a1',name:'Tunai',open:0}],tx:[],bud:{},goals:[],debts:[]};
let tab='home',q='';
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Penyimpanan gagal: '+e.message)}};
const rp=n=>(n<0?'-':'')+'Rp'+Math.abs(n).toLocaleString('id-ID');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Jakarta'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mon=d=>d.slice(0,7);
const accName=id=>(S.accs.find(a=>a.id==id)||{name:'?'}).name;
function bal(a){let b=a.open;S.tx.forEach(t=>{if(t.type=='in'&&t.acc==a.id)b+=t.amt;if(t.type=='out'&&t.acc==a.id)b-=t.amt;if(t.type=='tf'){if(t.acc==a.id)b-=t.amt;if(t.to==a.id)b+=t.amt}if(t.type=='adj'&&t.acc==a.id)b+=t.amt});return b}
const sum=(type,m)=>S.tx.filter(t=>t.type==type&&(!m||mon(t.date)==m)).reduce((a,t)=>a+t.amt,0);
const spent=(c,m)=>S.tx.filter(t=>t.type=='out'&&t.cat==c&&mon(t.date)==m).reduce((a,t)=>a+t.amt,0);
const cm=()=>mon(today());
function cl(){$('#sheet').classList.remove('on')}
function form(title,fields,ok){const d=$('#sheet');
 d.innerHTML=`<div class="box"><h3>${title}</h3>${fields.map(f=>`<label>${f.l}${f.o?`<select id="f_${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}"${o[0]==f.v?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`:`<input id="f_${f.k}" type="${f.t||'text'}" ${f.t=='number'?'min="0" inputmode="numeric"':''} value="${esc(f.v??'')}">`}</label>`).join('')}<div class="row"><button class="g" onclick="cl()">Batal</button><button id="ok" style="flex:1">Simpan</button></div></div>`;
 d.classList.add('on');$('#ok').onclick=()=>{const v={};fields.forEach(f=>v[f.k]=$('#f_'+f.k).value);if(ok(v)!==false){cl();render()}}}
d_=a=>[a.id,a.name];
function addTx(type){
 const accs=S.accs.map(d_);
 form(type=='in'?'Tambah pemasukan':type=='out'?'Tambah pengeluaran':'Transfer antar akun',[
  {k:'amt',l:'Nominal (Rp)',t:'number'},
  ...(type=='tf'?[]:[{k:'cat',l:'Kategori',o:(type=='in'?IN:OUT).map(c=>[c,c])}]),
  {k:'acc',l:type=='tf'?'Dari akun':'Akun',o:accs},
  ...(type=='tf'?[{k:'to',l:'Ke akun',o:accs}]:[]),
  {k:'date',l:'Tanggal',t:'date',v:today()},{k:'note',l:'Catatan (opsional)'}],v=>{
  const amt=Math.round(+v.amt);if(!(amt>0)){alert('Nominal harus lebih dari 0');return false}
  if(type=='tf'&&v.acc==v.to){alert('Akun asal dan tujuan harus berbeda');return false}
  S.tx.push({id:uid(),type,amt,cat:v.cat||'Transfer',acc:v.acc,to:v.to,date:v.date,note:v.note,created:Date.now()});save()})}
function delTx(id){if(confirm('Hapus transaksi ini?')){S.tx=S.tx.filter(t=>t.id!=id);save();render()}}
function txRow(t){const s=t.type=='in'?'+':t.type=='out'?'-':'';
 return `<div class="item"><div><b>${esc(t.cat)}</b><div class="s">${t.date} · ${esc(accName(t.acc))}${t.type=='tf'?' → '+esc(accName(t.to)):''}${t.note?' · '+esc(t.note):''}</div></div><div style="text-align:right"><b class="${t.type}">${s}${rp(t.amt)}</b><br><button class="g sm" onclick="delTx('${t.id}')">Hapus</button></div></div>`}
function pct(a,b){return b>0?Math.min(100,Math.round(a/b*100)):0}
function home(){
 const m=cm(),i=sum('in',m),o=sum('out',m),tot=S.accs.reduce((a,x)=>a+bal(x),0),sv=i>0?Math.round((i-o)/i*100):null;
 const rec=[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created).slice(0,5);
 const now=new Date(),due=S.debts.filter(d=>d.amt-d.paid>0&&d.due&&(new Date(d.due)-now)/864e5<=7);
 return `<div class="mq"><span>MONO FINANCE ✦ CATAT · ANGGARAN · TABUNG ✦ DATA LOKAL ✦ PERSONAL FINANCE ARCHIVE ✦ MONO FINANCE ✦ CATAT · ANGGARAN · TABUNG ✦</span><span>MONO FINANCE ✦ CATAT · ANGGARAN · TABUNG ✦ DATA LOKAL ✦ PERSONAL FINANCE ARCHIVE ✦ MONO FINANCE ✦ CATAT · ANGGARAN · TABUNG ✦</span></div><div class="s">// Personal finance archive</div><h1>Halo<br>${S.name?esc(S.name):'Dompet'}<br><span class="ol">Mono.</span></h1><div class="s">${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'Asia/Jakarta'})}</div><br>
 <div class="card"><div class="s">Total saldo</div><div class="big">${rp(tot)}</div></div>
 <div class="g2"><div class="card"><div class="s">Pemasukan bulan ini</div><b class="in">${rp(i)}</b></div><div class="card"><div class="s">Pengeluaran bulan ini</div><b class="out">${rp(o)}</b></div></div>
 <div class="card"><div class="row"><span>Selisih</span><b>${rp(i-o)}</b></div><div class="row s"><span>Ditabung</span><span>${sv===null?'Belum ada pemasukan':sv+'%'}</span></div></div>
 <div class="g2" style="margin-bottom:12px"><button onclick="addTx('in')">+ Pemasukan</button><button onclick="addTx('out')">+ Pengeluaran</button><button class="g" onclick="addTx('tf')">Transfer</button><button class="g" onclick="addGoal()">+ Target</button></div>
 ${due.length?`<div class="card" style="border-color:var(--wa)"><h2>Jatuh tempo ≤ 7 hari</h2>${due.map(d=>`<div class="row"><span>${esc(d.who)} (${d.due})</span><b>${rp(d.amt-d.paid)}</b></div>`).join('')}</div>`:''}
 <div class="card"><h2>Transaksi terbaru</h2>${rec.length?rec.map(txRow).join(''):'<div class="empty">Belum ada transaksi. Tekan + untuk mulai.</div>'}</div>
 <div class="card"><h2>Target tabungan</h2>${goalsH()}</div>`}
function goalsH(){return S.goals.length?S.goals.map(g=>`<div style="margin-bottom:10px"><div class="row"><b>${esc(g.name)}</b><span class="s">${pct(g.saved,g.target)}%</span></div><div class="bar"><i style="width:${pct(g.saved,g.target)}%"></i></div><div class="row s"><span>${rp(g.saved)} / ${rp(g.target)}${g.date?' · '+g.date:''}</span><span><button class="g sm" onclick="goalMv('${g.id}',1)">Setor</button> <button class="g sm" onclick="goalMv('${g.id}',-1)">Tarik</button></span></div></div>`).join(''):'<div class="empty">Belum ada target.</div>'}
function addGoal(){form('Target tabungan baru',[{k:'name',l:'Nama target'},{k:'target',l:'Nominal target (Rp)',t:'number'},{k:'date',l:'Tanggal target',t:'date'}],v=>{const t=Math.round(+v.target);if(!v.name.trim()||!(t>0)){alert('Nama dan nominal wajib diisi');return false}S.goals.push({id:uid(),name:v.name.trim(),target:t,saved:0,date:v.date});save()})}
function goalMv(id,dir){const g=S.goals.find(x=>x.id==id);form(dir>0?'Setor ke '+esc(g.name):'Tarik dari '+esc(g.name),[{k:'a',l:'Nominal (Rp)',t:'number'}],v=>{const a=Math.round(+v.a);if(!(a>0)||(dir<0&&a>g.saved)){alert('Nominal tidak valid');return false}g.saved+=dir*a;save()})}
function txs(){let l=[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);
 if(q){const k=q.toLowerCase();l=l.filter(t=>(t.cat+' '+(t.note||'')+' '+t.amt+' '+accName(t.acc)+' '+t.date).toLowerCase().includes(k))}
 return `<h1>Transaksi</h1><input placeholder="Cari kategori, catatan, nominal, akun, tanggal" value="${esc(q)}" oninput="q=this.value;render(1)"><div class="card" id="txl">${l.length?l.map(txRow).join(''):'<div class="empty">Tidak ada transaksi.</div>'}</div>`}
function budg(){const m=cm();
 return `<h1>Anggaran</h1><div class="card"><h2>Per kategori (bulan ini)</h2>${OUT.map(c=>{const b=S.bud[c]||0,u=spent(c,m);if(!b&&!u)return '';const p=b?Math.round(u/b*100):0;const col=p>=100?'var(--out)':p>=80?'var(--wa)':'var(--ac)';return `<div style="margin-bottom:10px"><div class="row"><span>${esc(c)}</span><span class="s">${b?p+'% · sisa '+rp(b-u):rp(u)}</span></div><div class="bar"><i style="width:${Math.min(100,p)}%;background:${col}"></i></div>${p>=100?'<span class="out s">Melebihi anggaran</span>':p>=80?'<span class="s" style="color:var(--wa)">Sudah 80%</span>':p>=50?'<span class="s">Sudah 50%</span>':''}</div>`}).join('')||'<div class="empty">Belum ada anggaran.</div>'}<button onclick="setBud()">Atur anggaran</button></div>
 <div class="card"><h2>Target tabungan</h2>${goalsH()}<button class="g" onclick="addGoal()">+ Target</button></div>
 <div class="card"><h2>Utang dan piutang</h2>${S.debts.length?S.debts.map(d=>`<div class="item"><div><b>${esc(d.who)}</b><div class="s">${d.kind=='utang'?'Utang':'Piutang'} · sisa ${rp(d.amt-d.paid)} dari ${rp(d.amt)}${d.due?' · jatuh tempo '+d.due:''}${d.amt-d.paid<=0?' · LUNAS':''}</div></div>${d.amt-d.paid>0?`<button class="g sm" onclick="payDebt('${d.id}')">Bayar</button>`:''}</div>`).join(''):'<div class="empty">Belum ada catatan.</div>'}<button class="g" onclick="addDebt()">+ Catat</button></div>`}
function setBud(){form('Atur anggaran bulanan',[{k:'c',l:'Kategori',o:OUT.map(c=>[c,c])},{k:'a',l:'Anggaran (Rp), 0 untuk hapus',t:'number'}],v=>{const a=Math.round(+v.a);if(!(a>=0)){alert('Nominal tidak valid');return false}if(a)S.bud[v.c]=a;else delete S.bud[v.c];save()})}
function addDebt(){form('Catat utang / piutang',[{k:'kind',l:'Jenis',o:[['utang','Utang saya'],['piutang','Piutang (dipinjam orang)']]},{k:'who',l:'Nama'},{k:'amt',l:'Nominal awal (Rp)',t:'number'},{k:'due',l:'Jatuh tempo',t:'date'}],v=>{const a=Math.round(+v.amt);if(!v.who.trim()||!(a>0)){alert('Nama dan nominal wajib diisi');return false}S.debts.push({id:uid(),kind:v.kind,who:v.who.trim(),amt:a,paid:0,due:v.due});save()})}
function payDebt(id){const d=S.debts.find(x=>x.id==id);form(d.kind=='utang'?'Bayar utang':'Terima pembayaran',[{k:'a',l:'Nominal (Rp)',t:'number',v:d.amt-d.paid},{k:'acc',l:'Akun',o:S.accs.map(d_)}],v=>{const a=Math.round(+v.a);if(!(a>0)||a>d.amt-d.paid){alert('Nominal tidak valid atau melebihi sisa');return false}d.paid+=a;S.tx.push({id:uid(),type:d.kind=='utang'?'out':'in',amt:a,cat:d.kind=='utang'?'Cicilan dan utang':'Pemasukan lainnya',acc:v.acc,date:today(),note:(d.kind=='utang'?'Bayar utang ':'Piutang dari ')+d.who,created:Date.now()});save()})}
function rep(){const m=cm(),ms=[];let d=new Date();d.setDate(1);for(let k=5;k>=0;k--){const x=new Date(d.getFullYear(),d.getMonth()-k,1);ms.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'))}
 const data=ms.map(x=>[x,sum('in',x),sum('out',x)]),mx=Math.max(1,...data.flat().filter(v=>typeof v=='number'));
 const cats={};S.tx.filter(t=>t.type=='out'&&mon(t.date)==m).forEach(t=>cats[t.cat]=(t.cat in cats?cats[t.cat]:0)+t.amt);
 const top=Object.entries(cats).sort((a,b)=>b[1]-a[1]),o=sum('out',m),i=sum('in',m),prev=data[4][2];
 let an;if(S.tx.length<5)an='Analisis belum tersedia: data belum cukup (minimal 5 transaksi).';else{an=`Kondisi bulan ini: <b>${i>=o?'surplus':'defisit'} ${rp(Math.abs(i-o))}</b>.`;if(top[0])an+=` Kategori terbesar: ${esc(top[0][0])} (${pct(top[0][1],o)}% dari pengeluaran).`;if(prev>0)an+=` Pengeluaran ${o>prev?'naik':'turun'} ${Math.abs(Math.round((o-prev)/prev*100))}% dibanding bulan lalu.`}
 return `<h1>Laporan</h1><div class="card"><h2>Pemasukan vs pengeluaran (6 bulan)</h2><div class="cols">${data.map(x=>`<div><b style="height:${x[1]/mx*90}px" title="${rp(x[1])}"></b><b class="o" style="height:${x[2]/mx*90}px" title="${rp(x[2])}"></b><br>${x[0].slice(5)}</div>`).join('')}</div><div class="s"><span class="in">■</span> masuk <span class="out">■</span> keluar</div></div>
 <div class="card"><h2>Pengeluaran per kategori</h2>${top.length?top.map(([c,v])=>`<div class="row"><span>${esc(c)}</span><span>${rp(v)}</span></div><div class="bar"><i style="width:${pct(v,o)}%"></i></div>`).join(''):'<div class="empty">Belum ada pengeluaran bulan ini.</div>'}</div>
 <div class="card"><h2>Analisis</h2><p>${an}</p></div>`}
function sett(){return `<h1>Pengaturan</h1><div class="card"><label>Nama<input value="${esc(S.name)}" onchange="S.name=this.value;save()"></label><label>Tema<select onchange="S.theme=this.value;save();theme()">${['system','light','dark'].map(t=>`<option value="${t}"${S.theme==t?' selected':''}>${{system:'Sistem',light:'Terang',dark:'Gelap'}[t]}</option>`).join('')}</select></label></div>
 <div class="card"><h2>Akun</h2>${S.accs.map(a=>`<div class="item"><span>${esc(a.name)}</span><b>${rp(bal(a))}</b></div>`).join('')}<button class="g" onclick="addAcc()">+ Akun</button> <button class="g" onclick="recon()">Rekonsiliasi</button></div>
 <div class="card"><h2>Data</h2><p class="s">Data tersimpan di browser perangkat ini dan bisa hilang jika data browser dihapus. Backup berkala disarankan.</p><div class="g2"><button onclick="dl('mono-backup.json',JSON.stringify(S),'application/json')">Backup JSON</button><button class="g" onclick="csv()">Ekspor CSV</button></div><br><label>Pulihkan dari JSON<input type="file" accept=".json" onchange="restore(this.files[0])"></label><button class="g" style="color:var(--out)" onclick="reset()">Reset semua data</button></div>
 <div class="s" style="text-align:center">MONO Finance v1.0</div>`}
function addAcc(){form('Akun baru',[{k:'n',l:'Nama akun'},{k:'o',l:'Saldo awal (Rp)',t:'number',v:0}],v=>{if(!v.n.trim()){alert('Nama wajib diisi');return false}S.accs.push({id:uid(),name:v.n.trim(),open:Math.round(+v.o)||0});save()})}
function recon(){form('Rekonsiliasi saldo',[{k:'a',l:'Akun',o:S.accs.map(a=>[a.id,a.name+' ('+rp(bal(a))+')'])},{k:'r',l:'Saldo sebenarnya (Rp)',t:'number'}],v=>{const a=S.accs.find(x=>x.id==v.a),r=Math.round(+v.r),df=r-bal(a);if(v.r===''||isNaN(r)){alert('Nominal tidak valid');return false}if(df&&confirm('Catat penyesuaian '+rp(df)+'?')){S.tx.push({id:uid(),type:'adj',amt:df,cat:'Penyesuaian saldo',acc:a.id,date:today(),created:Date.now()});save()}})}
function dl(n,c,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click()}
function csv(){const r=[['id','tanggal','jenis','kategori','nominal','akun','tujuan','catatan'],...S.tx.map(t=>[t.id,t.date,t.type,t.cat,t.amt,accName(t.acc),t.to?accName(t.to):'',t.note||''])];dl('transaksi.csv',r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.accs)||!Array.isArray(d.tx))throw 0;if(confirm('Timpa semua data saat ini dengan backup?')){S=d;save();render()}}catch(e){alert('File backup tidak valid')}};r.readAsText(f)}
function reset(){if(confirm('Hapus SEMUA data?')&&prompt('Ketik HAPUS untuk konfirmasi')=='HAPUS'){localStorage.removeItem(K);location.reload()}}
function theme(){document.documentElement.dataset.theme=S.theme=='system'?'':S.theme}
const T=[['home','Beranda'],['tx','Transaksi'],['bud','Anggaran'],['rep','Laporan'],['set','Atur']];
function render(keep){const f={home,tx:txs,bud:budg,rep,set:sett}[tab];
 if(keep){$('#txl').innerHTML=(()=>{const h=txs();return h.slice(h.indexOf('<div class="card" id="txl">')+27,h.lastIndexOf('</div>'))})();return}
 $('#app').innerHTML=f();$('#nav').innerHTML=T.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('');$('#fab').style.display=tab=='set'?'none':''}
$('#fab').onclick=()=>addTx('out');
$('#sheet').onclick=e=>{if(e.target.id=='sheet')cl()};
theme();render();
</script></body></html>
