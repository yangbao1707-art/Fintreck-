<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FinTrack — Keuangan Pribadi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F6; --surface:#FFFFFF; --surface-2:#F2F1EC;
  --ink:#14171A; --ink-soft:#5B6169; --ink-faint:#9AA0A6;
  --line:#EBE9E2;
  --brand:#0E7A5F; --brand-ink:#ffffff; --brand-soft:#E4F3EC; --brand-strong:#0B5F49;
  --blue:#2E6FE0; --blue-soft:#E8EFFD;
  --red:#D14343; --red-soft:#FBE8E8;
  --amber:#B8860B; --amber-soft:#FBF1DC;
  --radius-lg:20px; --radius-md:16px; --radius-sm:12px;
  --shadow-sm:0 1px 2px rgba(20,23,26,.04), 0 1px 1px rgba(20,23,26,.03);
  --shadow-md:0 8px 24px rgba(20,23,26,.08);
  --shadow-lg:0 16px 48px rgba(20,23,26,.14);
  --font-display:'Plus Jakarta Sans',sans-serif;
  --font-mono:'DM Mono',monospace;
}
[data-theme="dark"]{
  --bg:#0E1210; --surface:#161B18; --surface-2:#1D2320;
  --ink:#F3F5F3; --ink-soft:#A4ACA7; --ink-faint:#6C756F;
  --line:#262E29;
  --brand:#28C793; --brand-ink:#08201A; --brand-soft:#153229; --brand-strong:#28C793;
  --blue:#6E9CFB; --blue-soft:#1A2338;
  --red:#F2716B; --red-soft:#33191A;
  --amber:#E0B94A; --amber-soft:#332912;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 8px 24px rgba(0,0,0,.4);
  --shadow-lg:0 20px 60px rgba(0,0,0,.55);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-display); background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  transition:background .25s ease, color .25s ease;
}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:0; height:0;}
.num{font-family:var(--font-mono);}

/* ===== App shell ===== */
#app{max-width:480px; margin:0 auto; min-height:100vh; position:relative; background:var(--bg); padding-bottom:96px;}
@media (min-width:960px){
  #app{max-width:1080px;}
}

.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:20px 20px 6px;
}
.topbar .greet{font-size:13px; color:var(--ink-soft); font-weight:500;}
.topbar h1{font-size:20px; font-weight:800; letter-spacing:-.02em;}
.topbar .icons{display:flex; gap:8px;}
.iconbtn{
  width:38px; height:38px; border-radius:12px; border:1px solid var(--line);
  background:var(--surface); display:flex; align-items:center; justify-content:center;
  color:var(--ink-soft); transition:transform .15s ease, background .15s ease;
}
.iconbtn:active{transform:scale(.92);}

.view{padding:0 20px 12px; animation:fadein .28s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.hidden{display:none !important;}

/* ===== Cards ===== */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg);
  padding:18px; box-shadow:var(--shadow-sm);
}
.card + .card{margin-top:14px;}
.section-title{
  font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
  color:var(--ink-faint); margin:22px 2px 10px;
}
.row-between{display:flex; align-items:center; justify-content:space-between;}

/* ===== Balance hero ===== */
.hero{
  background:linear-gradient(155deg, var(--brand-strong), var(--brand));
  color:var(--brand-ink); border-radius:24px; padding:22px 20px 18px; margin-top:14px;
  position:relative; overflow:hidden; box-shadow:var(--shadow-md);
}
[data-theme="dark"] .hero{color:#08201A;}
.hero::after{
  content:""; position:absolute; right:-40px; top:-60px; width:180px; height:180px;
  border-radius:50%; background:rgba(255,255,255,.08);
}
.hero .lbl{font-size:12.5px; opacity:.85; font-weight:600; display:flex; align-items:center; gap:6px;}
.hero .amt{font-size:32px; font-weight:800; margin-top:6px; letter-spacing:-.02em;}
.hero .amt.blurred{filter:blur(9px); user-select:none;}
.eyebtn{background:rgba(255,255,255,.18); border:none; border-radius:8px; width:26px; height:26px; display:inline-flex; align-items:center; justify-content:center; color:inherit;}
.hero-split{display:flex; gap:10px; margin-top:16px;}
.hero-split .chip{
  flex:1; background:rgba(255,255,255,.14); border-radius:14px; padding:10px 12px;
}
.hero-split .chip .t{font-size:11.5px; opacity:.85; font-weight:600; display:flex; align-items:center; gap:5px;}
.hero-split .chip .v{font-size:15px; font-weight:800; margin-top:3px;}

.period-tabs{display:flex; gap:6px; margin-top:14px; overflow-x:auto; padding-bottom:2px;}
.ptab{
  flex:none; padding:7px 13px; border-radius:999px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink-soft); font-size:12.5px; font-weight:600;
}
.ptab.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}

/* Stat grid */
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px;}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:14px;}
.stat .t{font-size:12px; color:var(--ink-soft); font-weight:600; display:flex; align-items:center; gap:6px;}
.stat .v{font-size:17px; font-weight:800; margin-top:6px;}
.stat .v.pos{color:var(--brand);}
.stat .v.neg{color:var(--red);}

/* progress bar */
.pbar{height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden; margin-top:8px;}
.pbar > div{height:100%; border-radius:999px; transition:width .4s ease;}

/* Category summary row */
.cat-row{display:flex; align-items:center; gap:12px; padding:10px 0;}
.cat-row + .cat-row{border-top:1px solid var(--line);}
.cat-ic{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:17px; flex:none;}
.cat-mid{flex:1; min-width:0;}
.cat-mid .n{font-size:14px; font-weight:700;}
.cat-mid .s{font-size:12px; color:var(--ink-faint); margin-top:1px;}
.cat-amt{font-size:14px; font-weight:700; text-align:right; flex:none;}
.cat-amt .sub{display:block; font-size:11px; color:var(--ink-faint); font-weight:500;}

/* Transaction list */
.tx-daygroup{margin-top:6px;}
.tx-daylabel{font-size:12px; font-weight:700; color:var(--ink-faint); padding:14px 2px 6px;}
.tx-item{
  display:flex; align-items:center; gap:12px; padding:11px 4px; border-radius:14px;
  position:relative; transition:background .15s;
}
.tx-item:active{background:var(--surface-2);}
.tx-actions{display:flex; gap:6px;}
.tx-actions button{
  border:1px solid var(--line); background:var(--surface); border-radius:9px; width:30px; height:30px;
  display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:13px;
}
.tx-actions button.del{color:var(--red); border-color:var(--red-soft);}
.tx-title{font-size:14px; font-weight:700;}
.tx-sub{font-size:12px; color:var(--ink-faint); margin-top:1px;}
.tx-amt{font-weight:800; font-size:14.5px; flex:none;}
.tx-amt.in{color:var(--brand);}
.tx-amt.out{color:var(--red);}
.tx-amt.transfer{color:var(--blue);}

/* Buttons */
.btn{
  border:none; border-radius:14px; padding:13px 18px; font-weight:700; font-size:14px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;
  transition:transform .12s ease, opacity .15s;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--brand); color:var(--brand-ink);}
.btn-outline{background:transparent; border:1.5px solid var(--line); color:var(--ink);}
.btn-ghost{background:var(--surface-2); color:var(--ink);}
.btn-danger{background:var(--red-soft); color:var(--red);}
.btn-sm{width:auto; padding:9px 14px; font-size:13px; border-radius:11px;}

.fab{
  position:fixed; left:50%; bottom:88px; transform:translateX(-50%);
  width:58px; height:58px; border-radius:50%; background:var(--brand); color:var(--brand-ink);
  border:none; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-lg);
  z-index:40; font-size:26px; transition:transform .15s ease;
}
.fab:active{transform:translateX(-50%) scale(.9);}
@media (min-width:960px){ .fab{left:auto; right:calc(50% - 500px);} }

/* Bottom nav */
.bottomnav{
  position:fixed; bottom:0; left:0; right:0; background:var(--surface);
  border-top:1px solid var(--line); display:flex; z-index:30;
  padding:8px 6px calc(env(safe-area-inset-bottom,0) + 8px);
  max-width:480px; margin:0 auto;
}
@media (min-width:960px){ .bottomnav{max-width:1080px;} }
.navbtn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none;
  color:var(--ink-faint); font-size:10.5px; font-weight:600; padding:6px 2px; border-radius:10px;
}
.navbtn.active{color:var(--brand);}
.navbtn svg{width:22px; height:22px;}

/* Modal / sheet */
.overlay{
  position:fixed; inset:0; background:rgba(10,12,10,.5); z-index:100; display:flex; align-items:flex-end;
  backdrop-filter:blur(2px); animation:fadein .18s ease;
}
@media (min-width:640px){ .overlay{align-items:center; justify-content:center;} }
.sheet{
  background:var(--surface); width:100%; max-width:480px; border-radius:24px 24px 0 0;
  padding:18px 20px calc(env(safe-area-inset-bottom,0) + 20px); max-height:88vh; overflow-y:auto;
  animation:sheetup .25s cubic-bezier(.2,.9,.25,1);
}
@media (min-width:640px){ .sheet{border-radius:24px; max-height:80vh;} }
@keyframes sheetup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet-handle{width:38px; height:4px; background:var(--line); border-radius:99px; margin:0 auto 14px;}
.sheet-title{font-size:17px; font-weight:800; margin-bottom:16px;}

.field{margin-bottom:14px;}
.field label{font-size:12.5px; font-weight:700; color:var(--ink-soft); display:block; margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%; border:1.5px solid var(--line); border-radius:12px; padding:11px 12px; font-size:14.5px;
  background:var(--surface-2); color:var(--ink); outline:none; transition:border-color .15s;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--brand);}
.field textarea{resize:vertical; min-height:60px;}
.seg{display:flex; background:var(--surface-2); border-radius:12px; padding:3px; gap:3px;}
.seg button{flex:1; padding:9px; border:none; background:none; border-radius:9px; font-weight:700; font-size:13px; color:var(--ink-soft);}
.seg button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm);}
.chip-select{display:flex; flex-wrap:wrap; gap:8px;}
.chip-opt{padding:8px 12px; border-radius:11px; border:1.5px solid var(--line); font-size:13px; font-weight:600; background:var(--surface); color:var(--ink-soft); display:flex; align-items:center; gap:6px;}
.chip-opt.active{border-color:var(--brand); background:var(--brand-soft); color:var(--brand-strong);}

/* Empty state */
.empty{text-align:center; padding:50px 20px; color:var(--ink-faint);}
.empty .ic{font-size:40px; margin-bottom:12px;}
.empty .t1{font-weight:800; color:var(--ink); font-size:15px;}
.empty .t2{font-size:13px; margin-top:4px; max-width:240px; margin-inline:auto;}
.empty .btn{margin-top:18px; width:auto; padding:11px 20px;}

/* Insight card */
.insight{
  display:flex; gap:10px; padding:12px 14px; border-radius:14px; background:var(--brand-soft);
  color:var(--brand-strong); font-size:13px; font-weight:600; align-items:flex-start; line-height:1.4;
}
.insight + .insight{margin-top:8px;}
.insight .ic{flex:none;}

/* Toast */
#toast{
  position:fixed; bottom:170px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
  background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:12px; font-size:13.5px; font-weight:600;
  z-index:200; transition:all .25s ease; pointer-events:none; box-shadow:var(--shadow-lg); max-width:85%; text-align:center;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* Goal card */
.goal-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:16px;}
.goal-top{display:flex; align-items:center; gap:12px;}
.goal-ic{width:44px; height:44px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:20px; flex:none;}
.goal-name{font-weight:800; font-size:14.5px;}
.goal-deadline{font-size:11.5px; color:var(--ink-faint); margin-top:2px;}
.goal-nums{display:flex; justify-content:space-between; font-size:12.5px; margin-top:12px; color:var(--ink-soft); font-weight:600;}

/* Bill row */
.bill-row{display:flex; align-items:center; gap:12px; padding:12px 0;}
.bill-row + .bill-row{border-top:1px solid var(--line);}
.bill-badge{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:999px;}

/* Account card */
.acc-card{
  background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:15px; display:flex;
  align-items:center; gap:12px;
}
.acc-ic{width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:19px; flex:none;}

/* Settings list */
.settings-item{display:flex; align-items:center; justify-content:space-between; padding:13px 2px;}
.settings-item + .settings-item{border-top:1px solid var(--line);}
.settings-item .lab{font-size:14px; font-weight:600;}
.settings-item .sub{font-size:12px; color:var(--ink-faint); margin-top:2px;}
.switch{width:42px; height:25px; border-radius:99px; background:var(--surface-2); border:1px solid var(--line); position:relative; flex:none;}
.switch::after{content:""; position:absolute; width:19px; height:19px; border-radius:50%; background:var(--ink-faint); top:2px; left:2px; transition:all .2s;}
.switch.on{background:var(--brand-soft); border-color:var(--brand);}
.switch.on::after{background:var(--brand); left:19px;}

/* Onboarding */
.onb-wrap{max-width:480px; margin:0 auto; min-height:100vh; padding:40px 24px; display:flex; flex-direction:column;}
.onb-dots{display:flex; gap:6px; margin-bottom:30px;}
.onb-dots span{height:5px; flex:1; border-radius:99px; background:var(--surface-2);}
.onb-dots span.on{background:var(--brand);}
.onb-icon{font-size:44px; margin-bottom:10px;}
.onb-title{font-size:24px; font-weight:800; letter-spacing:-.02em; margin-bottom:8px;}
.onb-sub{color:var(--ink-soft); font-size:14px; line-height:1.5; margin-bottom:28px;}
.onb-foot{margin-top:auto; display:flex; gap:10px; padding-top:20px;}

/* search bar */
.searchbar{display:flex; gap:8px; align-items:center; background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:10px 12px; margin-top:14px;}
.searchbar input{border:none; background:none; outline:none; flex:1; font-size:14px; color:var(--ink);}
.filter-row{display:flex; gap:8px; overflow-x:auto; margin-top:10px; padding-bottom:2px;}

/* Lock screen */
.lock-wrap{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;}
.pindots{display:flex; gap:14px; margin:26px 0;}
.pindot{width:14px; height:14px; border-radius:50%; border:2px solid var(--line);}
.pindot.filled{background:var(--brand); border-color:var(--brand);}
.numpad{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; width:100%; max-width:280px;}
.numpad button{
  aspect-ratio:1; border-radius:50%; border:1px solid var(--line); background:var(--surface); font-size:20px;
  font-weight:700; color:var(--ink);
}
.numpad button:active{background:var(--surface-2);}

a{color:inherit;}
</style>
</head>
<body>

<div id="toast"></div>
<div id="root"></div>

<script>
/* =========================================================================
   FinTrack — single file app. State persisted via window.storage (personal).
   ========================================================================= */

const STORE_KEY = 'fintrack-state-v1';
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const todayISO = () => new Date().toISOString().slice(0,10);
const nowTime = () => new Date().toTimeString().slice(0,5);

function fmtIDR(n){
  n = Math.round(n||0);
  const neg = n<0; n = Math.abs(n);
  let s = n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return (neg?'-':'') + 'Rp' + s;
}
function fmtDateLong(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
}
function fmtDateShort(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('id-ID',{day:'numeric',month:'short'});
}
function monthLabel(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('id-ID',{month:'long',year:'numeric'});
}

const ICONS = ['🍔','🚗','🛍️','💡','🎬','💊','📚','🏠','📈','💳','🎁','💼','💰','✨','🐷','✈️','🎓','⚡','📱','🛒','☕','🐦','🏥','🎮','🧾','🏦','👛','💵','🏍️','🌴'];
const ACC_ICONS = {cash:'💵', bank:'🏦', ewallet:'📱', invest:'📈', other:'👛'};

function defaultCategories(){
  const inc = ['Gaji','Bonus','Freelance','Bisnis','Investasi','Hadiah','Lainnya'];
  const exp = ['Makanan','Transportasi','Belanja','Tagihan','Hiburan','Kesehatan','Pendidikan','Kebutuhan Rumah','Investasi','Cicilan','Lainnya'];
  const incIcons = ['💼','🎁','💻','🏢','📈','🎀','✨'];
  const expIcons = ['🍔','🚗','🛍️','💡','🎬','💊','📚','🏠','📈','💳','✨'];
  const cats = [];
  inc.forEach((n,i)=>cats.push({id:uid(),name:n,type:'income',icon:incIcons[i],color:'brand'}));
  exp.forEach((n,i)=>cats.push({id:uid(),name:n,type:'expense',icon:expIcons[i],color:'red'}));
  return cats;
}

function freshState(){
  return {
    onboarded:false,
    onboardStep:0,
    user:{name:'', currency:'IDR'},
    settings:{darkMode:false, hideBalance:false, pin:'', dateFormat:'DD/MM/YYYY'},
    accounts:[],
    categories:defaultCategories(),
    transactions:[],
    budgets:[],
    goals:[],
    bills:[],
    recurring:[],
    view:'dashboard',
    period:'month',
    locked:false,
  };
}

let S = freshState();
let SAVE_VERSION = 'new';
let saveTimer = null;
let chartsReady = false;
let storageAvailable = true;
let storageWarned = false;

function loadChartJS(){
  return new Promise((resolve, reject)=>{
    if(typeof Chart !== 'undefined'){ resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.3/chart.umd.min.js';
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('chart-load-failed'));
    document.head.appendChild(s);
  });
}

async function loadState(){
  try{
    if(!window.storage) throw new Error('no-storage-api');
    const res = await window.storage.get(STORE_KEY, false);
    if(res && res.value){
      const loaded = JSON.parse(res.value);
      S = Object.assign(freshState(), loaded);
      if(S.settings.pin){ S.locked = true; }
    }
  }catch(e){
    if(!window.storage || e.message==='no-storage-api'){ storageAvailable = false; }
    /* no saved state yet, or storage unavailable */
  }
  render();
}

function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    if(!storageAvailable){
      if(!storageWarned){ storageWarned = true; showToast('Penyimpanan permanen tidak tersedia di tampilan ini — data hanya tersimpan selama sesi ini'); }
      return;
    }
    try{
      if(!window.storage) throw new Error('no-storage-api');
      const copy = Object.assign({}, S);
      delete copy.locked;
      const result = await window.storage.set(STORE_KEY, JSON.stringify(copy), false);
      if(!result) throw new Error('save-returned-null');
    }catch(e){
      storageAvailable = false;
      if(!storageWarned){ storageWarned = true; showToast('Penyimpanan permanen tidak tersedia di tampilan ini — data hanya tersimpan selama sesi ini'); }
    }
  }, 150);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------------- derived helpers ---------------- */
function getPeriodRange(period){
  const now = new Date();
  let start, end;
  if(period==='today'){
    start = todayISO(); end = todayISO();
  }else if(period==='week'){
    const d = new Date(now); const day = (d.getDay()+6)%7;
    d.setDate(d.getDate()-day); start = d.toISOString().slice(0,10);
    end = todayISO();
  }else if(period==='month'){
    start = now.toISOString().slice(0,8)+'01'; end = todayISO();
  }else if(period==='lastmonth'){
    const y=now.getFullYear(), m=now.getMonth();
    const first = new Date(y, m-1, 1); const last = new Date(y, m, 0);
    start = first.toISOString().slice(0,10); end = last.toISOString().slice(0,10);
  }else{
    start='0000-01-01'; end='9999-12-31';
  }
  return {start,end};
}
function txInRange(tx, start, end){ return tx.date>=start && tx.date<=end; }

function accountBalance(acc){
  let bal = acc.initialBalance||0;
  S.transactions.forEach(t=>{
    if(t.type==='income' && t.accountId===acc.id) bal += t.amount;
    else if(t.type==='expense' && t.accountId===acc.id) bal -= t.amount;
    else if(t.type==='transfer'){
      if(t.accountId===acc.id) bal -= t.amount;
      if(t.toAccountId===acc.id) bal += t.amount;
    }
  });
  return bal;
}
function totalBalance(){ return S.accounts.reduce((s,a)=>s+accountBalance(a),0); }

function sumByType(type, start, end){
  return S.transactions.filter(t=>t.type===type && txInRange(t,start,end)).reduce((s,t)=>s+t.amount,0);
}
function catById(id){ return S.categories.find(c=>c.id===id); }
function accById(id){ return S.accounts.find(a=>a.id===id); }

function categoryTotals(type, start, end){
  const map = {};
  S.transactions.filter(t=>t.type===type && txInRange(t,start,end)).forEach(t=>{
    map[t.categoryId] = (map[t.categoryId]||0) + t.amount;
  });
  return Object.entries(map).map(([catId,total])=>({cat:catById(catId), total}))
    .filter(x=>x.cat).sort((a,b)=>b.total-a.total);
}

/* generate due recurring transactions */
function processRecurring(){
  const today = todayISO();
  let changed = false;
  S.recurring.forEach(r=>{
    let last = r.lastGenerated || r.startDate;
    let cursor = nextOccurrence(last, r.frequency, r.lastGenerated ? true : false);
    let guard = 0;
    while(cursor <= today && guard < 500){
      S.transactions.push({
        id:uid(), type:r.type, amount:r.amount, categoryId:r.categoryId, accountId:r.accountId,
        toAccountId:r.toAccountId||null, date:cursor, time:'09:00', note:r.note||'', tags:[], paid:true, recurringId:r.id
      });
      r.lastGenerated = cursor;
      cursor = nextOccurrence(cursor, r.frequency, true);
      changed = true; guard++;
    }
  });
  if(changed) persist();
}
function nextOccurrence(dateStr, freq, advance){
  const d = new Date(dateStr+'T00:00:00');
  if(!advance) return dateStr;
  if(freq==='daily') d.setDate(d.getDate()+1);
  else if(freq==='weekly') d.setDate(d.getDate()+7);
  else if(freq==='monthly') d.setMonth(d.getMonth()+1);
  else if(freq==='yearly') d.setFullYear(d.getFullYear()+1);
  return d.toISOString().slice(0,10);
}

        </select>

    ()=>`

      <div class="onb-title">Semua siap, ${S.user.name||'kamu'}!</div>

        <div style="font-size:12.5px; color:var(--ink-soft); margin-top:2px;">${S.tmpAcc?.name||'Rekening'}</div>
      </div>`,
  ];
  return `
  <div class="onb-wrap">
    <div class="onb-dots">${steps.map((_,i)=>`<span class="${i<=step?'on':''}"></span>`).join('')}</div>
    <div>${steps[step]()}</div>
    <div class="onb-foot">
      ${step>0?`<button class="btn btn-outline" id="ob-back" style="width:auto; padding:13px 20px;">Kembali</button>`:''}

    </div>
  </div>`;

function attachOnboarding(){
  const back = document.getElementById('ob-back');
  if(back) back.onclick = ()=>{ S.onboardStep--; render(); };
  document.getElementById('ob-next').onclick = ()=>{
    const step = S.onboardStep||0;
    if(step===1){
      const v = document.getElementById('ob-name').value.trim();
      if(!v){ showToast('Isi nama dulu ya'); return; }
      S.user.name = v;
    }
    if(step===3){
      const name = document.getElementById('ob-acc-name').value.trim();
      const type = document.getElementById('ob-acc-type').value;
      const bal = parseFloat(document.getElementById('ob-acc-bal').value)||0;
      if(!name){ showToast('Isi nama rekening dulu ya'); return; }
      S.tmpAcc = {name,type,initialBalance:bal};
    }
    if(step===4){
      const t = S.tmpAcc || {name:'Cash', type:'cash', initialBalance:0};
      S.accounts.push({id:uid(), name:t.name, type:t.type, icon:ACC_ICONS[t.type]||'👛', color:'brand', initialBalance:t.initialBalance, number:''});
      delete S.tmpAcc;
      S.onboarded = true;
      persist();
      render();
      return;
    }
    S.onboardStep = step+1;
    render();
  };
}

function attachLock(){
  document.querySelectorAll('.numpad button').forEach(b=>{
    b.onclick = ()=>{
      const n = b.dataset.n;
      if(n==='clear'){ pinBuffer=''; }
      else if(n==='back'){ pinBuffer = pinBuffer.slice(0,-1); }
      else { if(pinBuffer.length<4) pinBuffer += n; }
      if(pinBuffer.length===4){
        if(pinBuffer===S.settings.pin){ S.locked=false; pinBuffer=''; render(); }

  const groups = {};
  list.forEach(t=>{ (groups[t.date] = groups[t.date]||[]).push(t); });
  const dates = Object.keys(groups).sort((a,b)=> txFilter.sort==='oldest' ? a.localeCompare(b) : b.localeCompare(a));

  return `

/* ================= STATISTICS ================= */
function renderStats(){
  const {start,end} = getPeriodRange(S.period);
  const income = sumByType('income', start, end);
  const expense = sumByType('expense', start, end);
  const net = income-expense;
  const savingRate = income>0 ? Math.round(net/income*100) : 0;
  const catExp = categoryTotals('expense', start, end);
  const catTotal = catExp.reduce((s,c)=>s+c.total,0)||1;
  const biggestCat = catExp[0];

  // previous period comparison (month vs lastmonth) always computed on monthly basis
  const curM = getPeriodRange('month');
  const lastM = getPeriodRange('lastmonth');
  const curExpense = sumByType('expense', curM.start, curM.end);
  const lastExpense = sumByType('expense', lastM.start, lastM.end);
  const changePct = lastExpense>0 ? Math.round((curExpense-lastExpense)/lastExpense*100) : null;

  const insights = [];
  insights.push(`Pengeluaran Anda periode ini ${fmtIDR(expense)}.`);
  if(biggestCat) insights.push(`Kategori ${biggestCat.cat.name} menjadi pengeluaran terbesar (${Math.round(biggestCat.total/catTotal*100)}%).`);
  if(changePct!==null) insights.push(`Pengeluaran bulan ini ${changePct>=0?'naik':'turun'} ${Math.abs(changePct)}% dibanding bulan lalu.`);
  if(income>0) insights.push(`Saving rate periode ini ${savingRate}%.`);
  const estRemaining = income-expense;
  insights.push(`Jika pola pengeluaran tetap sama, estimasi sisa uang periode ini adalah ${fmtIDR(estRemaining)}.`);
  if(S.goals.length){
    const g = S.goals[0];
    const daysLeft = Math.max(1, Math.ceil((new Date(g.deadline)-new Date(todayISO()))/86400000));
    const perMonth = Math.ceil(Math.max(0,g.target-g.current) / Math.max(1, daysLeft/30));
    insights.push(`Anda perlu menabung sekitar ${fmtIDR(perMonth)}/bulan untuk mencapai target "${g.name}".`);
  }

  return `
  <div class="period-tabs">
    ${[['week','Mingguan'],['month','Bulanan'],['all','Tahunan/Semua']].map(([k,l])=>
      `<button class="ptab ${S.period===k?'active':''}" data-period="${k}">${l}</button>`).join('')}
  </div>

  <div class="stat-grid">
    <div class="stat"><div class="t">Pemasukan</div><div class="v pos num">${fmtIDR(income)}</div></div>
    <div class="stat"><div class="t">Pengeluaran</div><div class="v neg num">${fmtIDR(expense)}</div></div>
    <div class="stat"><div class="t">Net Cash Flow</div><div class="v ${net>=0?'pos':'neg'} num">${fmtIDR(net)}</div></div>
    <div class="stat"><div class="t">Saving Rate</div><div class="v num">${savingRate}%</div></div>
  </div>

  <div class="section-title">Smart Insight</div>
  ${insights.map(i=>`<div class="insight"><span class="ic">💡</span><span>${i}</span></div>`).join('')}

  ${catExp.length? `
  <div class="section-title">Kategori Pengeluaran</div>
  <div class="card"><canvas id="chart-donut" height="220"></canvas></div>` : ''}

  ${(income>0||expense>0) ? `
  <div class="section-title">Tren Pemasukan vs Pengeluaran</div>
  <div class="card"><canvas id="chart-trend" height="180"></canvas></div>` : ''}

  <div class="section-title">Tren Saldo</div>
  <div class="card"><canvas id="chart-balance" height="180"></canvas></div>
  `;
}

function drawCharts(){
  if(typeof Chart === 'undefined'){
    loadChartJS().then(()=>{ chartsReady = true; drawCharts(); }).catch(()=>{
      document.querySelectorAll('canvas[id^="chart-"]').forEach(c=>{
        const p = document.createElement('div');
        p.style.cssText = 'text-align:center; padding:20px; font-size:12.5px; color:var(--ink-faint);';
        p.textContent = 'Grafik tidak dapat dimuat (koneksi ke CDN diblokir).';
        c.replaceWith(p);
      });
    });
    return;
  }
  const isDark = S.settings.darkMode;
  const gridColor = isDark ? '#262E29' : '#EBE9E2';
  const textColor = isDark ? '#A4ACA7' : '#5B6169';
  Chart.defaults.font.family = "'Plus Jakarta Sans',sans-serif";
  Chart.defaults.color = textColor;

  const cf = document.getElementById('chart-cashflow');
  if(cf){
    const {start,end} = getPeriodRange(S.period);
    const days = last7Or30(start,end);
    const incomeData = days.map(d=>S.transactions.filter(t=>t.type==='income'&&t.date===d).reduce((s,t)=>s+t.amount,0));
    const expenseData = days.map(d=>S.transactions.filter(t=>t.type==='expense'&&t.date===d).reduce((s,t)=>s+t.amount,0));
    new Chart(cf, {type:'line', data:{labels:days.map(fmtDateShort), datasets:[
      {label:'Pemasukan', data:incomeData, borderColor:'#0E7A5F', backgroundColor:'rgba(14,122,95,.12)', tension:.35, fill:true, pointRadius:0},
      {label:'Pengeluaran', data:expenseData, borderColor:'#D14343', backgroundColor:'rgba(209,67,67,.1)', tension:.35, fill:true, pointRadius:0},
    ]}, options:{plugins:{legend:{position:'bottom', labels:{boxWidth:8,usePointStyle:true}}}, scales:{x:{grid:{display:false}}, y:{grid:{color:gridColor}, ticks:{callback:v=>fmtIDR(v).replace('Rp','')}}}}});
  }
  const donut = document.getElementById('chart-donut');
  if(donut){
    const {start,end} = getPeriodRange(S.period);
    const cats = categoryTotals('expense', start, end);
    const palette = ['#0E7A5F','#2E6FE0','#B8860B','#D14343','#8B5CF6','#EC4899','#14B8A6','#F59E0B','#6366F1','#84CC16'];
    new Chart(donut, {type:'doughnut', data:{labels:cats.map(c=>c.cat.name), datasets:[{data:cats.map(c=>c.total), backgroundColor:palette, borderWidth:0}]},
      options:{cutout:'68%', plugins:{legend:{position:'bottom', labels:{boxWidth:8,usePointStyle:true,font:{size:11}}}}}});
  }
  const trend = document.getElementById('chart-trend');
  if(trend){
    const months = last6Months();
    const incomeData = months.map(m=>S.transactions.filter(t=>t.type==='income'&&t.date.startsWith(m)).reduce((s,t)=>s+t.amount,0));
    const expenseData = months.map(m=>S.transactions.filter(t=>t.type==='expense'&&t.date.startsWith(m)).reduce((s,t)=>s+t.amount,0));
    new Chart(trend, {type:'bar', data:{labels:months.map(m=>monthShort(m)), datasets:[
      {label:'Pemasukan', data:incomeData, backgroundColor:'#0E7A5F', borderRadius:6},
      {label:'Pengeluaran', data:expenseData, backgroundColor:'#D14343', borderRadius:6},
    ]}, options:{plugins:{legend:{position:'bottom', labels:{boxWidth:8,usePointStyle:true}}}, scales:{x:{grid:{display:false}}, y:{grid:{color:gridColor}, ticks:{callback:v=>fmtIDR(v).replace('Rp','')}}}}});
  }
  const balc = document.getElementById('chart-balance');
  if(balc){
    const months = last6Months();
    let running = S.accounts.reduce((s,a)=>s+(a.initialBalance||0),0);
    const balances = months.map(m=>{
      const inc = S.transactions.filter(t=>t.type==='income'&&t.date.startsWith(m)).reduce((s,t)=>s+t.amount,0);
      const exp = S.transactions.filter(t=>t.type==='expense'&&t.date.startsWith(m)).reduce((s,t)=>s+t.amount,0);
      running += inc-exp; return running;
    });
    new Chart(balc, {type:'line', data:{labels:months.map(m=>monthShort(m)), datasets:[
      {label:'Saldo', data:balances, borderColor:'#2E6FE0', backgroundColor:'rgba(46,111,224,.1)', tension:.3, fill:true, pointRadius:3}
    ]}, options:{plugins:{legend:{display:false}}, scales:{x:{grid:{display:false}}, y:{grid:{color:gridColor}, ticks:{callback:v=>fmtIDR(v).replace('Rp','')}}}}});
  }
}
function last7Or30(start,end){
  const s = new Date(start), e = new Date(end);
  const diff = Math.max(0, Math.round((e-s)/86400000));
  const n = Math.min(Math.max(diff+1,1), 14);
  const arr = [];
  for(let i=n-1;i>=0;i--){ const d=new Date(e); d.setDate(d.getDate()-i); arr.push(d.toISOString().slice(0,10)); }
  return arr;
}
function last6Months(){
  const arr = []; const now = new Date();
  for(let i=5;i>=0;i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); arr.push(d.toISOString().slice(0,7)); }
  return arr;
}
function monthShort(m){ const d = new Date(m+'-01T00:00:00'); return d.toLocaleDateString('id-ID',{month:'short'}); }

/* ================= MODALS / SHEETS ================= */
function openSheet(html, onOpen){
  const wrap = document.createElement('div');
  wrap.className = 'overlay'; wrap.id = 'active-overlay';
  wrap.innerHTML = `<div class="sheet"><div class="sheet-handle"></div>${html}</div>`;
  wrap.addEventListener('click', e=>{ if(e.target===wrap) closeSheet(); });
  document.body.appendChild(wrap);
  if(onOpen) onOpen(wrap);
}
function closeSheet(){
  const el = document.getElementById('active-overlay');
  if(el) el.remove();
}

      document.getElementById('f-toacc-wrap').classList.toggle('hidden', type!=='transfer');

    });

      const amount = parseFloat(document.getElementById('f-amount').value);
      if(!amount || amount<=0){ showToast('Isi nominal yang valid'); return; }
      const accountId = document.getElementById('f-account').value;
      if(!accountId){ showToast('Pilih rekening'); return; }
      const date = document.getElementById('f-date').value || todayISO();
      const time = document.getElementById('f-time').value || nowTime();
      const note = document.getElementById('f-note').value.trim();
      const tags = document.getElementById('f-tags').value.split(',').map(s=>s.trim()).filter(Boolean);
      let categoryId = null, toAccountId = null;
      if(type==='transfer'){
        toAccountId = document.getElementById('f-toaccount').value;
        if(toAccountId===accountId){ showToast('Rekening asal dan tujuan harus berbeda'); return; }
      } else {
        categoryId = document.getElementById('f-category').value;
      }
      const rec = {id: existing?existing.id:uid(), type, amount, categoryId, accountId, toAccountId, date, time, note, tags, paid:true};
      if(isEdit){
        const idx = S.transactions.findIndex(t=>t.id===existing.id);
        S.transactions[idx] = rec;
        showToast('Transaksi diperbarui');
      } else {
        S.transactions.push(rec);
        showToast('Transaksi ditambahkan');
      }
      persist(); closeSheet(); render();
    };

/* ================= EXPORT / IMPORT ================= */
function exportCSV(){
  const rows = [['Tanggal','Waktu','Jenis','Kategori','Rekening','Rekening Tujuan','Nominal','Catatan','Tag']];
  S.transactions.forEach(t=>{
    const cat = catById(t.categoryId); const acc = accById(t.accountId); const toAcc = t.toAccountId?accById(t.toAccountId):null;
    rows.push([t.date, t.time, t.type, cat?cat.name:'', acc?acc.name:'', toAcc?toAcc.name:'', t.amount, (t.note||'').replace(/,/g,';'), (t.tags||[]).join('|')]);
  });
  const csv = rows.map(r=>r.join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'fintrack-transaksi.csv'; a.click();
  URL.revokeObjectURL(url);
  showToast('CSV berhasil diunduh');
}
function importCSV(file){
  const reader = new FileReader();
  reader.onload = e=>{
    const lines = e.target.result.split('\n').filter(l=>l.trim());
    lines.slice(1).forEach(line=>{
      const [date,time,type,catName,accName,toAccName,amount,note,tags] = line.split(',');
      if(!date||!type||!amount) return;
      let cat = S.categories.find(c=>c.name===catName && c.type===type);
      if(!cat && type!=='transfer'){ cat = {id:uid(), name:catName||'Lainnya', type, icon:'💸', color:'brand'}; S.categories.push(cat); }
      let acc = S.accounts.find(a=>a.name===accName);
      if(!acc){ acc = {id:uid(), name:accName||'Import', type:'other', icon:'👛', initialBalance:0}; S.accounts.push(acc); }
      let toAcc = toAccName ? S.accounts.find(a=>a.name===toAccName) : null;
      S.transactions.push({id:uid(), type, amount:parseFloat(amount)||0, categoryId:cat?cat.id:null, accountId:acc.id, toAccountId:toAcc?toAcc.id:null, date, time:time||'00:00', note:note||'', tags:(tags||'').split('|').filter(Boolean), paid:true});
    });
    persist(); render(); showToast('Import CSV selesai');
  };
  reader.readAsText(file);
}

  document.querySelectorAll('[data-delcat]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    confirmAction('Hapus Kategori','Kategori ini akan dihapus. Transaksi lama tetap tersimpan.',()=>{
      S.categories = S.categories.filter(x=>x.id!==b.dataset.delcat); persist(); render();
    });
  });
  const tglDark = document.getElementById('tgl-dark'); if(tglDark) tglDark.onclick = ()=>{ S.settings.darkMode = !S.settings.darkMode; persist(); render(); };
  const tglHide = document.getElementById('tgl-hide'); if(tglHide) tglHide.onclick = ()=>{ S.settings.hideBalance = !S.settings.hideBalance; persist(); render(); };
  const tglPin = document.getElementById('tgl-pin'); if(tglPin) tglPin.onclick = ()=>{
    if(S.settings.pin){ confirmAction('Nonaktifkan PIN','PIN kunci aplikasi akan dinonaktifkan.',()=>{ S.settings.pin=''; persist(); render(); }); }
    else openPinSetupSheet();
  };
  const expCsv = document.getElementById('btn-export-csv'); if(expCsv) expCsv.onclick = exportCSV;
  const expPdf = document.getElementById('btn-export-pdf'); if(expPdf) expPdf.onclick = ()=>window.print();
  const impCsv = document.getElementById('import-csv'); if(impCsv) impCsv.onchange = e=>{ if(e.target.files[0]) importCSV(e.target.files[0]); };
  const btnReset = document.getElementById('btn-reset'); if(btnReset) btnReset.onclick = ()=>{
    confirmAction('Reset Semua Data','Semua data (transaksi, rekening, anggaran, target) akan dihapus permanen dan tidak dapat dikembalikan.',async ()=>{
      S = freshState();
      if(storageAvailable && window.storage){
        try{ await window.storage.set(STORE_KEY, JSON.stringify(S), false); }catch(e){}
      }
      render();
    });
  };
}

/* ================= INIT ================= */
loadChartJS().then(()=>{ chartsReady = true; }).catch(()=>{});
loadState().then(()=>{ processRecurring(); render(); });
</script>
</body>
</html>
